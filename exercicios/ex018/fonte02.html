<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Twilight';
            src: url('Fontes/Twilight Luminance Free.otf') format('truetype'), url('Fontes/Twilight Luminance Free.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            
            /* 
            Tipos de forma()
            -opentype(otf)
            -truetype(ttf)
            -embedded-opentype
            -truetype-aat(Apple Advanced Typography)
            -svg
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'Twilight', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque ipsum expedita labore dolorum quia ipsa assumenda, facere beatae odit, suscipit nobis! Tenetur commodi consectetur accusantium consequatur obcaecati, corrupti laudantium voluptatem!</p>
</body>
</html>
