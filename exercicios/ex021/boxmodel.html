<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border-width: 10px;
            border-style: solid;
            border-color: darkgray;
            
            border:10px solid darkgray;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            padding: 10px;
            /* se for o mesmo nos 4 lados pode indicar só uma vez o valor, e vai aplicar o mesmo nos 4 lados*/

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
            /* margin: auto;
               Faz ficar no meio*/
            margin: 20px auto 40px auto;
            /*Se na margem da direita e esquerda for colocado "auto", ele vai centralizar automaticamente*/

            outline-width: 5px;
            outline-style: dashed;
            outline-color: darkgreen;

            outline: 5px dashed salmon;

        }

        a{
            display: inline-block;
            border-width: 10px;
            border-style: solid;
            border-color: darkgoldenrod
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box level</h1>
    <p>Paragrafos tambem são exemplos de box level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona</p>
</body>
</html>
