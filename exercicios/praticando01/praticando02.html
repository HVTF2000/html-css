<!DOCTYPE html>
<html lang="pr-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando div</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        div > p{
            display: none;
        }

        div:hover > p {
            display: block;
            color: white;
            background-color: red;
            width: 400px;
        }

        
    </style>
</head>
<body>
    <h1>Testando div</h1>
    <p>Passe o mouse aqui por cima do texto abaixo</p>
    <div>Passe o mouse por aqui
        <p>Texto escondido</p>
    </div>
    <p>Fim da pratica</p>
</body>
</html>
