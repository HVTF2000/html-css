<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em html5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abri esse site em varios dispositivo diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width:750px )" srcset="imagens/imagem-p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/imagem-m.png" type="image/png">
        <img src="imagens/imagem-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzr audios em HTML5</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/guanacast-33 (1).mp3" type="audio/mpeg">
        <source src="midia/guanacast-33 (1).mp3" type="audio/ogg">
        <source src="midia/guanacast-33 (1).mp3" type="audio/wav">
        <p>Infelizmente seu navegador não é capaz de bixar audio</p>
        <a href="midia/guanacast-33 (1).mp3">Clique aqui para baixar o seu arquivo MP3</a>
    </audio>
    <!--MP3 WAV OGG-->
</body>
</html>
